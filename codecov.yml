# Codecov configuration (see https://docs.codecov.com/docs/codecov-yaml).
# Generated code and platform scaffolding are not what the tests are about.
ignore:
  - '**/*.g.dart'
  - '**/*.freezed.dart'
  - 'lib/l10n/**'
  - 'lib/generated/**'
  - 'test/**'
  - 'integration_test/**'
  - 'tool/**'
  - 'android/**'
  - 'ios/**'
  - 'linux/**'
  - 'macos/**'
  - 'windows/**'
  - 'web/**'

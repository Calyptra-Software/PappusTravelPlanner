name: travelplanner
description: >-
  Offline-first trip planner: day-by-day itineraries of places and transport
  legs, costs and shared-expense splitting, and checklists — all in a single
  portable SQLite file.
publish_to: 'none'

# In Android, build-name is used as versionName while build-number is used as
# versionCode; both can be overridden with `flutter build --build-name/--build-number`.
version: 1.10.0+11

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management and routing.
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.3
  go_router: ^18.0.0

  # Persistence: a single portable SQLite file (WasmDatabase in browser storage on web).
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  shared_preferences: ^2.5.5

  # Opening / importing / exporting the database file.
  file_picker: ^12.1.2
  # Already resolved beneath file_picker (it is its Android implementation, and
  # file_picker imports it on every platform). Named here because this app uses
  # it directly and deliberately: the URI the Storage Access Framework handed a
  # picked photo over as reaches Dart only through `AndroidPlatformFile`, and
  # that URI is the one thing that can be asked where the photograph was taken.
  # See features/attachments/attachment_flow.dart.
  android_file_picker: ^1.0.0
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.0

  intl: ^0.20.2
  home_widget: ^0.9.3 # Android home-screen widget
  pdf: ^3.13.0 # exporting a trip as a printable PDF
  http: ^1.2.2 # connection search against the MOTIS API (Transitous)
  timezone: ^0.11.1 # UTC->wall-clock for imported connections (per-stop IANA tz)
  # Both are here for the Transitous usage policy: it asks every request to
  # carry the client's version, and the data sources to be linked (not merely
  # named) somewhere visible. See core/app_info.dart and core/widgets/attribution.dart.
  package_info_plus: ^10.2.1 # the app's own version, for the API User-Agent
  url_launcher: ^6.3.2 # opening the data-source attribution links
  # The map. flutter_map is pure Dart, which is why it is the one renderer that
  # runs on all six targets — the native MapLibre bindings have no Linux, and a
  # Leaflet-in-a-WebView has none either. See features/map/basemap.dart for the
  # tile source and the conditions attached to it.
  flutter_map: ^8.3.1
  # Reading a GPX track. Already resolved as a transitive dependency (via
  # `pdf`), but this app parses foreign files with it, which is a direct and
  # deliberate use rather than a coincidence of the tree — see SECURITY.md.
  xml: ^7.0.1
  latlong2: ^0.10.1 # its coordinate type, shared by the pure map_features.dart
  # Photos and files hung on part of a plan: decoding, downscaling, re-encoding
  # to JPEG and reading a picture's own EXIF position. Pure Dart, which is the
  # same reason flutter_map was chosen — a native codec plugin has no Linux and
  # no web, and this runs on all six targets. See features/attachments/.
  image: ^4.9.2
  # Where the device says it is, for the map's "you are here" — the app's first
  # and only runtime permission, asked for on a button press and never at
  # launch. Endorsed on all six targets (Linux goes through GeoClue over D-Bus),
  # so the map keeps the platform coverage flutter_map was chosen for. Nothing
  # of what it answers is stored or sent anywhere; see features/map/location/.
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqlite3: ^3.5.2 # used by tests to build an old-schema DB for migration checks

  # Code generation: `dart run build_runner build --delete-conflicting-outputs`.
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.4

  # Launcher icons: `dart run flutter_launcher_icons` (see flutter_launcher_icons.yaml).
  flutter_launcher_icons: ^0.14.4

  # Lets a test stand in for the location plugin (`MockPlatformInterfaceMixin`),
  # so the permission-and-fix state machine can be exercised without a receiver.
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true # localizations from lib/l10n/*.arb, see l10n.yaml

  # Roboto (Apache-2.0, bundled with Flutter — see Roboto-LICENSE.txt) is loaded
  # by the PDF export as raw bytes, since the standard PDF font can't draw the €
  # sign or other non-Latin-1 glyphs, and the offline app can't fetch a webfont.
  # Declared as plain assets (read via rootBundle), not a Flutter `fonts:` family.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    # The bundled fonts' terms, shown on the About screen's licence page
    # (core/licenses.dart) — a font ships inside the binary, so its licence has
    # to ship with it.
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/TransportGlyphs-ATTRIBUTION.txt
    # The mark, shown above the licence page's title. 256 px because it is drawn
    # at 72 dp — big enough for a 3x screen, and small enough that the binary
    # does not carry a launcher-sized bitmap for one icon.
    - assets/logo/pappus_mark.png
    # The world's country outlines, for the visited-countries map. Public
    # domain (Natural Earth), credited anyway on the licence page — see the
    # attribution file beside it for what was changed on the way in.
    - assets/geo/countries.json
    - assets/geo/countries-ATTRIBUTION.txt

  # assets/icon/pappus.png and pappus_adaptive.png are only source images for
  # flutter_launcher_icons, so they are deliberately not bundled here.

  fonts:
    # A tiny custom icon font (4 glyphs) for transport modes Material Icons has
    # no symbol for: horse, gondola, chairlift, and T-bar. Regenerate with
    # `python3 assets/fonts/build_transport_glyphs.py assets/fonts/TransportGlyphs.ttf`.
    # Referenced by `IconData(0xE800…, fontFamily: 'TransportGlyphs')` — see
    # kTransportModeIcons in features/itinerary/widgets/transport_mode.dart.
    - family: TransportGlyphs
      fonts:
        - asset: assets/fonts/TransportGlyphs.ttf

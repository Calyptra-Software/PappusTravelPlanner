name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Generated sources (`*.g.dart` and the localizations) are committed, so
      # regenerating them must be a no-op — otherwise a table, provider or ARB
      # key was edited without `build_runner` / `gen-l10n` being run after it.
      - name: Check generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        # Secrets are unavailable to pull requests from forks; Codecov's
        # tokenless path is unreliable, so skip rather than fail the run.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The Android toolchain has ceilings that nothing else checks: AGP is pinned
  # to 8.x because the scaffold's AGP 9 breaks plugins that apply the Kotlin
  # Gradle Plugin, and that in turn caps Gradle at 9.5.x because 9.6.0 removed
  # an internal API AGP 8.x still calls (see AGENTS.md, "Platform build
  # constraints"). Both failures happen while Gradle applies the plugins, so
  # they are invisible to `analyze` and `test` — a dependency bump crossing
  # either ceiling merged green until this job existed.
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not just for Gradle: `cache: gradle` is what keeps the wrapper from
      # re-downloading the ~200 MB distribution on every run.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The exact command used to cut a release. `release` signs with the debug
      # keys (android/app/build.gradle.kts), so this needs no keystore secret
      # and works on pull requests from forks.
      - name: Build APK
        run: flutter build apk --split-per-abi

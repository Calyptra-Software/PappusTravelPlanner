name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Generated sources (`*.g.dart` and the localizations) are committed, so
      # regenerating them must be a no-op — otherwise a table, provider or ARB
      # key was edited without `build_runner` / `gen-l10n` being run after it.
      - name: Check generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        # Secrets are unavailable to pull requests from forks; Codecov's
        # tokenless path is unreliable, so skip rather than fail the run.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The Android toolchain is the part nothing else checks. No version is pinned
  # any more — AGP is on 9.x, the wrapper on 9.6.x — so what this job guards is
  # not a ceiling but a mode: `android.builtInKotlin=false` in
  # android/gradle.properties leaves Kotlin to the Kotlin Gradle Plugin, and
  # that is the only arrangement that builds under Flutter 3.44 (see AGENTS.md,
  # "Platform build constraints"). Every failure here happens while Gradle
  # applies its plugins, long before a line of Dart or Kotlin is compiled, so
  # they are invisible to `analyze` and `test` — a breaking bump merged green
  # until this job existed.
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not just for Gradle: `cache: gradle` is what keeps the wrapper from
      # re-downloading the ~200 MB distribution on every run.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The exact command used to cut a release. `release` signs with the debug
      # keys (android/app/build.gradle.kts), so this needs no keystore secret
      # and works on pull requests from forks.
      - name: Build APK
        run: flutter build apk --split-per-abi

      # The arm64-v8a split is the one every phone made in the last decade
      # runs, so it is the one worth handing out: a reviewer can install the
      # branch instead of reading it. Debug-signed like the build above, so it
      # is a test build and nothing else — it cannot upgrade an install signed
      # with a release key.
      #
      # Named per commit, and `overwrite` because a name is claimed once: a
      # second run on the same commit — a re-run, or `workflow_dispatch` after
      # the push — would otherwise fail the job on the upload rather than
      # replace the file. The APK a commit builds is the same APK either way,
      # so the last run winning costs nothing.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: pappus-arm64-v8a-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14

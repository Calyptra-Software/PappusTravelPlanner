name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Generated sources (`*.g.dart` and the localizations) are committed, so
      # regenerating them must be a no-op — otherwise a table, provider or ARB
      # key was edited without `build_runner` / `gen-l10n` being run after it.
      - name: Check generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        # Secrets are unavailable to pull requests from forks; Codecov's
        # tokenless path is unreliable, so skip rather than fail the run.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The Android toolchain is the part nothing else checks. No version is pinned
  # any more — AGP is on 9.x, the wrapper on 9.6.x — so what this job guards is
  # not a ceiling but a mode: `android.builtInKotlin=true` in
  # android/gradle.properties has AGP compile every Kotlin source in the build —
  # ours and all eleven plugin modules' — instead of the Kotlin Gradle Plugin
  # (see AGENTS.md, "Platform build constraints"; under Flutter 3.44 only the
  # other setting built at all). Every failure here happens while Gradle
  # applies its plugins, long before a line of Dart or Kotlin is compiled, so
  # they are invisible to `analyze` and `test` — a breaking bump merged green
  # until this job existed. What it still cannot see is the widget: native
  # Kotlin that compiles and then quietly stops updating is a phone's job.
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not just for Gradle: `cache: gradle` is what keeps the wrapper from
      # re-downloading the ~200 MB distribution on every run.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The command used to cut a release, in the one variant that can be
      # installed beside a real one: `pappusSideBySide` suffixes the
      # applicationId and relabels the app (android/app/build.gradle.kts).
      # Without it the artifact below is refused by any phone already holding
      # the released app — same id, different signing key reads as a
      # conflicting package, not as a second app. The build path is otherwise
      # untouched, so this job still guards what it was added to guard: the
      # plugins Gradle applies, long before Dart or Kotlin is compiled.
      #
      # `release` signs with the debug keys, so this needs no keystore secret
      # and works on pull requests from forks.
      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_pappusSideBySide: 'true'
        run: flutter build apk --split-per-abi

      # The one fact about this build that nothing else would notice going
      # wrong. `third_party/geolocator_android` exists so that no Google Play
      # Services code is linked in (AGENTS.md, and SECURITY.md states it as a
      # fact about the released binary) -- and the way to lose that is not a
      # broken build but a quiet one: a `flutter pub upgrade` that drops the
      # override, a new plugin that brings its own `play-services-*`, or a
      # merge that reverts the vendored copy. All three still compile.
      #
      # The resolved runtime classpath rather than the APK's dex: it is the
      # question actually being asked -- is the artifact in the build at all --
      # and it cannot be fooled by R8 having renamed the classes on the way in.
      - name: Check no Google Play Services are linked in
        working-directory: android
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath \
            > "$RUNNER_TEMP/deps.txt"
          if grep -i -e 'play-services' -e 'com\.google\.android\.gms' "$RUNNER_TEMP/deps.txt"; then
            echo "::error::Google Play Services reached the release classpath — see AGENTS.md on third_party/geolocator_android"
            exit 1
          fi
          echo "No Play Services in the release runtime classpath."

      # The arm64-v8a split is the one every phone made in the last decade
      # runs, so it is the one worth handing out: a reviewer can install the
      # branch instead of reading it. It installs *alongside* the real app
      # rather than over it (see the build step) and therefore starts on an
      # empty database of its own — a test build cannot touch the trips on the
      # phone, which is the property that makes it safe to hand to anyone.
      #
      # Named per commit, and `overwrite` because a name is claimed once: a
      # second run on the same commit — a re-run, or `workflow_dispatch` after
      # the push — would otherwise fail the job on the upload rather than
      # replace the file. The APK a commit builds is the same APK either way,
      # so the last run winning costs nothing.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: pappus-ci-arm64-v8a-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # The Linux counterpart of the APK above: the branch as an AppImage somebody
  # can run instead of reading. It is also the only job that builds the Linux
  # runner at all, so a CMake or plugin change that breaks it shows up here.
  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What `flutter build linux` needs from the system (Flutter's own list).
      - name: Install the Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # PAPPUS_SIDE_BY_SIDE suffixes the GTK application id (linux/CMakeLists.txt),
      # which is what gives this build preferences of its own -- and with them
      # its own saved database path -- instead of opening the file the released
      # app last used. On a desktop that matters more than on a phone: nothing
      # else separates the two, and a schema bump on a branch would migrate
      # somebody's real trips out of the released app's reach.
      #
      # Set for the whole of both steps: the build reads it to choose the id,
      # the packaging to name the desktop entry and the icon to match.
      - name: Build and package
        env:
          PAPPUS_SIDE_BY_SIDE: 'true'
        run: |
          flutter build linux --release
          tool/package_linux.sh "$(git rev-parse --short HEAD)" dist

      # The AppImage alone: the tarball is the same bundle, and a reviewer wants
      # one file to run. An artifact is handed out as a zip, which drops the
      # executable bit, so it needs a `chmod +x` after unpacking -- as every
      # AppImage downloaded from anywhere does.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: pappus-ci-linux-x86_64-${{ github.sha }}
          path: dist/*.AppImage
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # The Windows counterpart of the two artifacts above. Built on Windows because
  # Flutter cannot cross-compile it, which also makes this the only place the
  # Windows runner and its plugins are compiled at all.
  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Kept in sync with the `flutter:` constraint in pubspec.yaml.
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # PAPPUS_SIDE_BY_SIDE renames the product and its InternalName
      # (windows/runner/Runner.rc). The product name is what path_provider keys
      # %APPDATA% by, so this build keeps preferences of its own -- and with
      # them its own saved database path -- instead of opening the file the
      # released app last used; the ".ci" InternalName is how the app knows.
      - name: Build and package
        shell: pwsh
        env:
          PAPPUS_SIDE_BY_SIDE: 'true'
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tool/package_windows.ps1 -Version (git rev-parse --short HEAD) -OutputDir dist -Folder

      # The folder rather than the zip a release attaches: upload-artifact zips
      # what it is given, so a zip would have to be unpacked twice. `dist/` as
      # the path keeps the folder itself as the archive's single top entry.
      # Unsigned, so SmartScreen warns on the first start.
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: pappus-ci-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 compiles Kotlin itself; the Flutter template writes `false` to leave that
# to the Kotlin Gradle Plugin instead. Under Flutter 3.44 `false` was the only
# arrangement that built at all (see AGENTS.md, "Platform build constraints").
# 3.47 lifted that, and this is `true` because the escape hatch is documented as
# going away before AGP 10 — so the move is made while it is still optional and
# can be undone by editing one line, rather than under a deadline.
#
# It is not a per-module setting: with this on, KGP is applied to *no* project —
# not `:app`, not any of the eleven plugin modules — so every Kotlin source in
# the build changes compiler at once. The `kotlin { }` block in app/build.gradle.kts
# keeps working and `jvmTarget` stays JVM_17; kotlin-stdlib resolves to the same
# 2.4.10 either way, so nothing about the runtime moves.
android.builtInKotlin=true

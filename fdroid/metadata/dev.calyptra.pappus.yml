Builds:
  - versionName: 1.11.2
    versionCode: 1014
    commit: 762a2209d64bbfa408ad24401b479e3b49471994
    sudo:
      - mkdir -p /home/runner/work/PappusTravelPlanner
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/Calyptra-Software/PappusTravelPlanner/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/PappusTravelPlanner/PappusTravelPlanner
      - cd ..
      - mv dev.calyptra.pappus $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo dev.calyptra.pappus
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/PappusTravelPlanner/PappusTravelPlanner
      - cd ..
      - mv dev.calyptra.pappus $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
      - popd
      - mv $repo dev.calyptra.pappus
    ndk: r28c

